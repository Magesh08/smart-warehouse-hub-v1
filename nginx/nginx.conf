worker_processes 1;
error_log /tmp/boulty_nginx_error.log warn;
pid /tmp/boulty_nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /usr/local/etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /tmp/boulty_nginx_access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen       8080;
        server_name  localhost;

        # Add proxy headers to all requests
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_set_header  X-Nginx-Proxy     true;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection "upgrade";

        # Route /api/* → FastAPI REST
        location /api/ {
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Route /ws/* → FastAPI WebSocket
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Serve React app under /smartwarehouseapp/
        location /smartwarehouseapp/ {
            alias  FRONTEND_PATH/smart-warehouse-hub/dist/;
            index  index.html;
            try_files $uri $uri/ /smartwarehouseapp/index.html;
        }

        # Serve static data app under /smartwarehousedata/
        location /smartwarehousedata/ {
            alias  FRONTEND_PATH/smartwarehousedata/;
            index  index.html;
            try_files $uri $uri/ /smartwarehousedata/index.html;
        }

        # Redirect root to smartwarehouseapp
        location = / {
            return 302 /smartwarehouseapp/;
        }

        # Health check
        location /nginx-health {
            add_header Content-Type application/json;
            add_header X-Process-Time "${request_time}s";
            add_header X-Server "nginx";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Expose-Headers "X-Process-Time, X-Server";
            return 200 '{"status":"ok","service":"nginx","port":8080}';
        }
    }
}
